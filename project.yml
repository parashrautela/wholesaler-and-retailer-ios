name: JewelIndia
options:
  bundleIdPrefix: com.jewelindia
  minimumXcodeGenVersion: 2.0.0
  deploymentTarget:
    iOS: "26.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    # 9.0.0 is the version that matters here, not just a routine bump: it's
    # what added a `nonce:` parameter to `signIn` (google/GoogleSignIn-iOS#402).
    # Below it, the SDK generates its own nonce internally via AppAuth on
    # every sign-in with no way to retrieve it, so `signInWithIdToken` can
    # never be given a matching value — see EntryView.startGoogleNatively.
    from: 9.0.0
targets:
  JewelIndia:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: JewelIndia/Sources
      - path: JewelIndia/Resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    # XcodeGen only writes an .xcscheme when a target declares one explicitly
    # (there's no auto-generated default) — without this, a clean checkout or
    # CI has nothing to build/archive until someone opens the project in
    # Xcode and lets it silently create a local, unshared scheme.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jewelindia.app
        MARKETING_VERSION: "1.0"
        # Bump on EVERY TestFlight upload — App Store Connect rejects a build
        # number it has already seen for this MARKETING_VERSION.
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # This must be the team that owns the `com.jewelindia.app` provisioning
        # profiles, which is J3BH2RPA7Y — the only one holding both a Store
        # profile for this bundle id and an Apple Distribution certificate.
        # It previously read AAF6438546, which is the *Admin Panel's* team and
        # has no profile for this app at all: XcodeGen would rewrite the team
        # Xcode had been signing with, and the archive would fail with a
        # provisioning error that points nowhere near this line.
        DEVELOPMENT_TEAM: J3BH2RPA7Y
        CODE_SIGN_STYLE: Automatic
    info:
      path: JewelIndia/Info.plist
      properties:
        CFBundleDisplayName: Jewel India
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad gets all four, so the auth split layout and the adaptable
        # sidebar behave the way the web's responsive breakpoints do.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.jewelindia.app.auth
            CFBundleURLSchemes:
              - jewelindia
          # Google Sign-In hands control back through the reversed iOS client
          # id. Populated from GOOGLE_IOS_REVERSED_CLIENT_ID in Config.xcconfig;
          # while that is blank the app falls back to the browser OAuth flow and
          # this entry is inert.
          - CFBundleURLName: com.jewelindia.app.google
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
        NSCameraUsageDescription: Jewel India uses the camera to photograph jewellery designs and capture verification documents.
        NSPhotoLibraryUsageDescription: Jewel India needs access to your photos so you can upload jewellery designs and business documents.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        AI_PIPELINE_URL: $(AI_PIPELINE_URL)
        SITE_URL: $(SITE_URL)
        UIAppFonts:
          - Cirka-Light.ttf
          - Cirka-Regular.ttf
          - Cirka-Bold.ttf
          - GildaDisplay-Regular.ttf
          - Gilroy-Regular.ttf
          - Gilroy-Medium.ttf
          - Gilroy-SemiBold.ttf
          - Gilroy-Bold.ttf
          - Manrope-ExtraLight.ttf
          - Manrope-Light.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - Satoshi-Light.ttf
          - Satoshi-Regular.ttf
          - Satoshi-Medium.ttf
          - Satoshi-Bold.ttf
          - Satoshi-Black.ttf